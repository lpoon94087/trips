            html += "<div class='page'><div class='inner'>" +
                "<div class='head'><div class='ch'><small>Chapter " + (n + 1) + "</small>" + esc(pg.t) + "</div><div class='dt'>" + pg.d + "</div></div>" +
                "<div class='grid' style='grid-template-areas:" + areas + "'>" +
                pg.p.map(function(p, k) { return panel(p, String.fromCharCode(97 + k), 1200); }).join('') +
                "</div><div class='foot'>" + (n + 2) + "</div></div></div>";
        });
        html += "<div class='page back'><div class='inner'>" +
            "<div class='end'>THE END</div>" +
            "<div class='hero grid' style='grid-template-rows:1fr'>" + panel(DATA.back, '1 / 1 / 2 / 7', 1600) + "</div>" +
            "<div class='credits'>Photos by Laurie &amp; Su &middot; Japan, October 2026<br>" +
            "<a href='japan.html'>See every stop on the map</a> &middot; <a href='story.html'>Watch the slideshow</a></div>" +
            "</div></div>";
        document.getElementById('book').innerHTML = html;

        // Photo viewer
        var viewer = document.getElementById('viewer'), media = viewer.querySelector('.media'),
            caption = viewer.querySelector('.caption'), gp = viewer.querySelector('.gp'), cur = -1, openedAt = 0;
        function show(i) {
            var p = all[i]; cur = i;
            media.innerHTML = "<div class='frame'><img src='" + src(p, 2400) + "' alt=''><span class='credit'>Photo by " + p[2] + "</span></div>";
            caption.innerHTML = '<b>' + esc(p[3]) + '</b><span>' + p[4] + '</span>';
            gp.href = 'https://photos.google.com/share/' + ALBUM_ID + '/photo/' + p[0] + '?key=' + ALBUM_KEY;
            viewer.classList.add('open'); openedAt = Date.now();
        }
        function close() { viewer.classList.remove('open'); media.innerHTML = ''; cur = -1; }
        document.getElementById('book').addEventListener('click', function(e) {
            var el = e.target.closest('.panel');
            if (el) show(+el.dataset.i);
        });
        viewer.querySelector('.close').onclick = close;
        viewer.addEventListener('click', function(e) {
            if (Date.now() - openedAt < 400) return;
            if (e.target === viewer || e.target.tagName === 'IMG') close();
        });
        document.addEventListener('keydown', function(e) {
            if (cur < 0) return;
            if (e.key === 'Escape') close();
            else if (e.key === 'ArrowRight' && cur < all.length - 1) show(cur + 1);
            else if (e.key === 'ArrowLeft' && cur > 0) show(cur - 1);
        });
    </script>
</body>
</html>
