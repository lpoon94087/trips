        function thumb(p, size) { return 'https://lh3.googleusercontent.com/pw/' + p[1] + '=w' + size + '-h' + size + '-c'; }
        function photoLink(p) { return 'https://photos.google.com/share/' + ALBUM_ID + '/photo/' + p[0] + '?key=' + ALBUM_KEY; }
        function sample(arr, n) {
            if (arr.length <= n) return arr.slice();
            var out = [];
            for (var i = 0; i < n; i++) out.push(arr[Math.floor(i * arr.length / n)]);
            return out;
        }

        var typeColors = { travel: '#5b6b7f', town: '#b8432f', hike: '#2e7d32', nature: '#12877a', onsen: '#c77a12' };
        var japan = [];

        stops.forEach(function(s, si) {
            var color = typeColors[s.type];
            var icon = L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:" + color + "; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.6); margin-top: -7px; margin-left: -7px;'></div>",
                iconSize: [14, 14],
                iconAnchor: [0, 0]
            });
            var marker = L.marker([s.lat, s.lng], {icon: icon}).addTo(map);

            var detailsHtml = s.details.length ? "<ul class='popup-details'>" + s.details.map(function(d) { return '<li>' + d + '</li>'; }).join('') + "</ul>" : '';
            var videos = s.photos.filter(function(p) { return p[2]; }).length, stills = s.photos.length - videos;
            var counts = [];
            if (stills) counts.push(stills + (stills === 1 ? ' photo' : ' photos'));
            if (videos) counts.push(videos + (videos === 1 ? ' video' : ' videos'));
            var photosHtml = "<p class='photos-title'>&#128247; " + counts.join(' &middot; ') + "</p><div class='photos'>" +
                s.photos.map(function(p, pi) {
                    return "<a" + (p[2] ? " class='video'" : "") + " href='" + photoLink(p) + "' target='_blank' data-s='" + si + "' data-p='" + pi + "'><img loading='lazy' src='" + thumb(p, 200) + "' alt=''></a>";
                }).join('') + "</div>";

            marker.bindPopup(
                "<div class='popup-header " + s.type + "'>" +
                    "<span class='popup-title'>" + s.name + "</span>" +
                    "<span class='popup-day'>" + s.day + "</span>" +
                "</div>" +
                "<div class='popup-body'>" +
                    (s.offplan ? "<span class='offplan'>Not in the original plan</span>" : "") +
                    "<p class='popup-desc'>" + s.desc + "</p>" +
                    detailsHtml +
                    photosHtml +
                    "<a class='popup-link' href='" + ALBUM_URL + "' target='_blank'>&#128247; Open full album</a>" +
                "</div>", { maxWidth: 300 });

            var t = sample(s.photos, 3).map(function(p) { return "<img loading='lazy' src='" + thumb(p, 180) + "' alt=''>"; }).join('');
            marker.bindTooltip("<div class='photo-tooltip'><div class='row'>" + t + "</div><span>" + s.name + " &middot; " + s.day + "</span></div>", {
                direction: 'top', offset: [0, -8], opacity: 1, className: 'photo-tooltip-wrap'
            });

            if (s.key !== 'taipei') japan.push([s.lat, s.lng]);
        });

        L.polyline(track, {
            color: '#1e3150', weight: 3, opacity: 0.7, dashArray: '6, 6', lineJoin: 'round'
        }).addTo(map);

        map.fitBounds(L.latLngBounds(japan), { padding: [30, 30] });

        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<strong>Stops</strong><br>' +
                '<i style="background: #b8432f"></i> Towns<br>' +
                '<i style="background: #2e7d32"></i> Hikes<br>' +
                '<i style="background: #12877a"></i> Nature<br>' +
                '<i style="background: #c77a12"></i> Onsen<br>' +
                '<i style="background: #5b6b7f"></i> Travel<br>' +
                '<b class="line"></b> Route from photo GPS';
            return div;
        };
        legend.addTo(map);

        // In-page viewer: photos at full size, videos streamed from the album (720p, falling back to 360p).
        var viewer = document.getElementById('viewer'), media = viewer.querySelector('.media'),
            caption = viewer.querySelector('.caption'), gp = viewer.querySelector('.gp'),
            prevBtn = viewer.querySelector('.prev'), nextBtn = viewer.querySelector('.next'), cur = null;

        function show(si, pi) {
            var s = stops[si], p = s.photos[pi], base = 'https://lh3.googleusercontent.com/pw/' + p[1];
            cur = { s: si, p: pi };
            if (p[2]) {
                media.innerHTML = "<video controls autoplay playsinline poster='" + base + "=w1600-h1600'></video>";
                var v = media.firstChild;
                v.onerror = function() { if (!/=m18$/.test(v.src)) v.src = base + '=m18'; };
                v.src = base + '=m22';
            } else {
                media.innerHTML = "<img src='" + base + "=w2400-h2400' alt=''>";
            }
            caption.innerHTML = '<b>' + s.name + '</b><span>' + s.day + ' &middot; ' + (pi + 1) + ' of ' + s.photos.length + '</span>';
            gp.href = photoLink(p);
            prevBtn.hidden = pi === 0;
            nextBtn.hidden = pi === s.photos.length - 1;
            viewer.classList.add('open');
        }
        function step(d) {
            if (!cur) return;
            var n = cur.p + d;
            if (n >= 0 && n < stops[cur.s].photos.length) show(cur.s, n);
        }
        function close() { viewer.classList.remove('open'); media.innerHTML = ''; cur = null; }

        document.addEventListener('click', function(e) {
            var a = e.target.closest('.photos a');
            if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            show(+a.dataset.s, +a.dataset.p);
        });
        prevBtn.onclick = function() { step(-1); };
        nextBtn.onclick = function() { step(1); };
        viewer.querySelector('.close').onclick = close;
        viewer.querySelector('.stage').addEventListener('click', function(e) { if (e.target === this) close(); });
        document.addEventListener('keydown', function(e) {
            if (!cur) return;
            if (e.key === 'Escape') close();
            else if (e.key === 'ArrowLeft') step(-1);
            else if (e.key === 'ArrowRight') step(1);
        });
        var touchX = null;
        viewer.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, { passive: true });
        viewer.addEventListener('touchend', function(e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
            touchX = null;
        });
    </script>
