<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our saved places | Nakasendō 2026</title>
  <meta name="theme-color" content="#1e3150">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="places">
  <main class="wrap">
    <header class="page-head">
      <h1>Our saved places</h1>
      <p>From our shared Google Maps list, grouped by type and in trip order.</p>
    </header>

    <div class="pl-top">
      <div class="pl-combo">
        <label class="sr-only" for="pl-q">Find a saved place</label>
        <input id="pl-q" class="pl-search" type="search" placeholder="Find a place, like soba or Yanaka" autocomplete="off" autocapitalize="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pl-suggest">
        <ul class="pl-suggest" id="pl-suggest" role="listbox" hidden></ul>
      </div>
      <nav class="pl-jump" id="pl-jump" aria-label="Jump to a category"></nav>
    </div>

    <a class="btn ghost pl-listbtn" href="https://maps.app.goo.gl/hqgxaayJiJdpBsfd6" target="_blank" rel="noopener">Open the shared list in Google Maps</a>

    <div id="pl-groups"></div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/places.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (function () {
    var GROUPS = [["food", "Food"], ["sweets", "Sweets and cafés"], ["onsen", "Onsen"], ["sight", "Sights"], ["shop", "Shopping"], ["transit", "Stations"]];
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function norm(s) { return String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, ""); }
    function gmaps(p) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.q); }
    function meta(p) {
      var m = [esc(p.cat || "")];
      if (p.price) m.push(esc(p.price));
      if (p.rating) m.push("★&nbsp;" + p.rating);
      return m.join('<span class="sep" aria-hidden="true"></span>');
    }
    var byTrip = function (a, b) { return a.order - b.order || a.listPos - b.listPos; };

    // ---------- grouped list ----------
    var groupsEl = document.getElementById("pl-groups"), jumpEl = document.getElementById("pl-jump");
    var html = "", jump = "";
    GROUPS.forEach(function (g) {
      var rows = SAVED.filter(function (p) { return p.kind === g[0]; }).sort(byTrip);
      if (!rows.length) return;
      jump += '<a href="#g-' + g[0] + '">' + g[1] + " <span>" + rows.length + "</span></a>";
      html += '<section class="pl-group" id="g-' + g[0] + '" aria-labelledby="gh-' + g[0] + '"><h2 id="gh-' + g[0] + '">' + g[1] + "</h2><ul class=\"pl-list\">";
      var lastArea = null;
      rows.forEach(function (p) {
        if (p.areaLabel !== lastArea) {
          html += '<li class="pl-area">' + esc(p.areaLabel) + (p.days ? '<span>' + esc(p.days) + "</span>" : "") + "</li>";
          lastArea = p.areaLabel;
        }
        html += '<li class="pl-item" id="p-' + SAVED.indexOf(p) + '"><div class="pl-text"><p class="pl-name">' + esc(p.name) + '</p><p class="pl-meta">' + meta(p) + "</p></div>" +
          '<a class="btn small" href="' + gmaps(p) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(p.name) + ' in Google Maps">Google Maps</a></li>';
      });
      html += "</ul></section>";
    });
    groupsEl.innerHTML = html;
    jumpEl.innerHTML = jump;

    // ---------- autocomplete ----------
    var q = document.getElementById("pl-q"), box = document.getElementById("pl-suggest");
    var matches = [], active = -1;
    function close() { box.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); active = -1; }
    function show() {
      var t = norm(q.value.trim());
      if (!t) { close(); return; }
      // names that start with the text first, then anything that contains it
      var starts = [], contains = [];
      SAVED.forEach(function (p) {
        var n = norm(p.name), hay = n + " " + norm(p.cat) + " " + norm(p.areaLabel);
        if (n.indexOf(t) === 0 || n.split(/\s+/).some(function (w) { return w.indexOf(t) === 0; })) starts.push(p);
        else if (hay.indexOf(t) >= 0) contains.push(p);
      });
      matches = starts.sort(byTrip).concat(contains.sort(byTrip)).slice(0, 8);
      if (!matches.length) {
        box.innerHTML = '<li class="pl-none" role="option" aria-disabled="true">No saved place matches "' + esc(q.value.trim()) + '"</li>';
      } else {
        box.innerHTML = matches.map(function (p, i) {
          return '<li role="option" id="s-' + i + '" data-i="' + i + '"><button type="button" class="pl-go" data-i="' + i + '"><span class="pl-name">' + esc(p.name) + '</span><span class="pl-meta">' +
            esc(p.cat || "") + ", " + esc(p.areaLabel) + '</span></button><a class="btn small" href="' + gmaps(p) + '" target="_blank" rel="noopener">Maps</a></li>';
        }).join("");
      }
      box.hidden = false; q.setAttribute("aria-expanded", "true"); active = -1;
    }
    function highlight(i) {
      box.querySelectorAll("[role=option]").forEach(function (li, k) { li.classList.toggle("on", k === i); });
      active = i;
      if (i >= 0) q.setAttribute("aria-activedescendant", "s-" + i); else q.removeAttribute("aria-activedescendant");
    }
    function goTo(p) {
      close(); q.blur();
      var el = document.getElementById("p-" + SAVED.indexOf(p));
      if (!el) return;
      el.scrollIntoView({ block: "center" });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
    q.addEventListener("input", show);
    q.addEventListener("focus", function () { if (q.value.trim()) show(); });
    q.addEventListener("keydown", function (e) {
      if (box.hidden || !matches.length) return;
      if (e.key === "ArrowDown") { e.preventDefault(); highlight(Math.min(active + 1, matches.length - 1)); }
      else if (e.key === "ArrowUp") { e.preventDefault(); highlight(Math.max(active - 1, 0)); }
      else if (e.key === "Enter") { e.preventDefault(); goTo(matches[active >= 0 ? active : 0]); }
      else if (e.key === "Escape") close();
    });
    box.addEventListener("click", function (e) {
      var b = e.target.closest(".pl-go"); if (b) goTo(matches[+b.dataset.i]);
    });
    document.addEventListener("click", function (e) { if (!e.target.closest(".pl-combo")) close(); });
  })();
  </script>
</body>
</html>
