<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#1e3150">
  <link rel="manifest" href="manifest.webmanifest">

<body data-page="stays">
  <main class="wrap">
    <header class="page-head">
      <h1>Where we sleep</h1>
      <p>Eight stays. "Show to taxi driver" puts the address on screen in large Japanese text.</p>
    </header>
    <div class="stays-grid" id="stays"></div>

  <div class="taxi" id="taxi" role="dialog" aria-modal="true" aria-label="Address for the taxi driver">
    <p class="ask" lang="ja">この住所までお願いします。</p>
    <p class="big" lang="ja"></p>
    <p class="nm"></p>
    <p class="tel"></p>
    <button class="btn close" type="button">Close</button>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
